<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <linearGradient id="neonCyanEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Icon Hexagon Frame -->
  <polygon points="40,12 68,28 68,60 40,76 12,60 12,28" fill="#0d1117" stroke="url(#neonCyanEmerald)" stroke-width="2.5" />
  
  <!-- Cyber Lightning Bolt -->
  <polygon points="42,18 26,44 38,44 34,64 54,36 42,36" fill="url(#neonCyanEmerald)" filter="url(#neonGlow)" />
  
  <!-- Typography -->
  <text x="82" y="46" font-family="'Outfit', 'Space Grotesk', -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="-0.5">
    TECH<tspan fill="url(#neonCyanEmerald)">PULSE</tspan>
  </text>
  
  <!-- Autonomous Indicator -->
  <text x="83" y="64" font-family="'Space Grotesk', monospace" font-weight="600" font-size="10" fill="#06b6d4" letter-spacing="2">
    AMP WEB STORIES // 24/7
  </text>
</svg>
