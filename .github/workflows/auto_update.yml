name: "TechSeconds Manual Static Rebuild"

on:
  # Scheduled RSS auto-scraping is intentionally disabled to prevent
  # thin/scraped content and guarantee 100% Google AdSense & Search compliance.
  workflow_dispatch: # Trigger manually after publishing new original articles

permissions:
  contents: write

jobs:
  rebuild-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Rebuild Original Static Assets & Verify Integrity
        env:
          TECHSECONDS_NAME: ${{ vars.TECHSECONDS_NAME || 'TechSeconds' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://techseconds.com' }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID || 'G-LHGLZ8Q53T' }}
        run: |
          python rebuild_assets.py
          python verify_integrity.py

      - name: Commit & Push Verified Updates to Main
        run: |
          git config --global user.name "ssilu07"
          git config --global user.email "64121882+ssilu07@users.noreply.github.com"

          git add dist/

          if git diff --staged --quiet; then
            echo "No changes to commit. Static publication is up to date."
          else
            git commit -m "chore(build): rebuild verified static publication $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push origin main
            echo "Verified build pushed to main."
          fi

