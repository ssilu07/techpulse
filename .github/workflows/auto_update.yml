name: "TechPulse Autonomous 4-Hour Dispatch"

on:
  schedule:
    # Runs automatically every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Quality-First Static Orchestrator & AMP Validator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TECHPULSE_NAME: ${{ vars.TECHPULSE_NAME || 'TechPulse' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://techpulse-gadget.vercel.app' }}
        run: |
          python fetch_and_generate.py --max-new 4

      - name: Commit & Push Autopilot Updates to Main
        run: |
          # Use verified repository owner as git author to prevent Vercel Hobby deployment blocking
          git config --global user.name "ssilu07"
          git config --global user.email "64121882+ssilu07@users.noreply.github.com"
          
          git add dist/
          
          # Check if there are changes before committing
          if git diff --staged --quiet; then
            echo "✅ No new stories or updates to commit. Catalog is fully up to date."
          else
            git commit -m "⚡ Autonomous Feed Update: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push origin main
            echo "🚀 Changes pushed to main. Vercel deployment triggered automatically."
          fi

